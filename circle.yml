version: 2.1

jobs:
  php-tests:
    docker:
      - image: php:7
    working_directory: ~/build
    steps:
      - run: 'apt-get -y update'
      - run: 'apt-get -y install curl unzip'
      - run: 'apt-get -y install git'  # Suppress Circle CI's git warning

      - checkout

      - run:
          name: "Install Composer"
          command: |
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - run:
          name: "Install Dependencies"
          command: |
            composer install

      - run:
          name: "Run Tests"
          command: |
            mkdir ./tmp/
            ./vendor/phpunit/phpunit/phpunit --log-junit ./tmp/logfile.xml

      - store_test_results:
          path: "./tmp/"

  javascript-tests:
    docker:
      - image: cimg/node:20.19
    working_directory: ~/build
    steps:
      - checkout
      - run:
          name: "Run Calendar Parameter Tests"
          command: npm run test:calendar
      - run:
          name: "Run Card Image Widget Tests"
          command: npm run test:card-images

workflows:
  tests:
    jobs:
      - php-tests
      - javascript-tests
